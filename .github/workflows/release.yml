name: Publish release

on:
  push:
    branches: [main]
    paths: ['docs/releases/v*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version and notes
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import tomllib

          version = json.loads(Path('frontend/package.json').read_text())['version']
          backend = tomllib.loads(Path('backend/pyproject.toml').read_text())['project']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or version != backend:
              raise SystemExit('Frontend and backend must declare the same semantic version.')
          notes = Path(f'docs/releases/v{version}.md')
          if not notes.is_file():
              raise SystemExit('Release notes are required.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'tag=v{version}', file=output)
              print(f'notes={notes.as_posix()}', file=output)
          PY
      - name: Tag the main commit and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' > "$RUNNER_TEMP/release-tag-sha"; then
            if [ "$(cat "$RUNNER_TEMP/release-tag-sha")" != "$GITHUB_SHA" ]; then
              echo 'The existing tag belongs to another commit; it will not be moved.' >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" --silent
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists for this commit."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --target "$GITHUB_SHA" --latest \
              --title "ORIENTA MVP 1 · $RELEASE_TAG" --notes-file "$RELEASE_NOTES"
          fi
